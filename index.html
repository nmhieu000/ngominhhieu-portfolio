<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ngo Minh Hieu — UX/UI Portfolio</title>
<style>img{max-width:100%}body{margin:0}</style>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js" defer></script>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap">
<link rel="stylesheet" href="site.css">
<style>
/* Layout: daytime arcade race (bright pixel sky, clouds, city skyline, grass + dirt, two-lane road). Scrolling drives the car along one long road of sectors; dialog boxes are red-framed game text boxes. Art is pixel, text and project images are crisp. */
:root{--sky1:#4FB8EE;--sky2:#9FDCF7;--city:#7C8BA3;--city2:#5C6B86;--grass:#5FC640;--grass2:#3E9A2A;--dirt:#8B5A2B;--dirt2:#6E4420;--road:#3B3B45;--road2:#2E2E37;--box:#232329;--frame:#E8322C;--on:#FFFFFF;--on-mute:#C9CBD6;--yellow:#F5D000;--red:#E8322C;--green:#39D353;--trackH:34vh;--px:"VT323","Courier New",monospace;--ps:"Press Start 2P","VT323",monospace;--vt:"VT323","Courier New",monospace;color-scheme:dark}
html,body{height:auto}
body{background:var(--sky1);color:var(--on);overflow-x:hidden;font-family:var(--vt);font-size:22px;line-height:1.25}
h1,h2,h3{margin:0;font-family:var(--vt);font-weight:400;line-height:1.05;text-transform:uppercase;color:#fff;text-shadow:3px 3px 0 #1E3A5F;letter-spacing:.02em}
.px{font-family:var(--px);font-size:17px;letter-spacing:.06em;line-height:1.3;text-transform:uppercase}
.stage{position:sticky;top:0;height:100vh;height:100dvh;overflow:hidden;background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 62%,var(--sky2) 100%)}
.spacer{height:300vh}
.layer{position:absolute;left:0;top:0;height:100%;will-change:transform;image-rendering:pixelated}
.clouds{width:300%;height:60%;background-repeat:repeat-x;background-size:640px 100%;animation:drift 60s linear infinite}
@keyframes drift{to{background-position:-640px 0}}
.sun{position:absolute;right:30%;top:7%;width:84px;height:84px;z-index:0}
.sun .core{position:absolute;inset:18px;background:#FFE24A;box-shadow:0 0 0 6px #FFC928;clip-path:polygon(25% 0,75% 0,75% 12%,88% 12%,88% 25%,100% 25%,100% 75%,88% 75%,88% 88%,75% 88%,75% 100%,25% 100%,25% 88%,12% 88%,12% 75%,0 75%,0 25%,12% 25%,12% 12%,25% 12%)}
.sun .rays{position:absolute;inset:-30px;background:repeating-conic-gradient(from 0deg,rgba(255,226,74,.55) 0 12deg,transparent 12deg 30deg);clip-path:circle(50%);animation:rays 24s linear infinite;mask:radial-gradient(circle,transparent 42%,#000 44%)}
@keyframes rays{to{transform:rotate(360deg)}}
.sunlight{position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,240,170,.35),transparent 45%);pointer-events:none;animation:shimmer 7s ease-in-out infinite alternate}
@keyframes shimmer{to{opacity:.45;transform:translateX(4%)}}
.flags{position:absolute;left:0;right:0;top:0;height:100%;width:400%;will-change:transform;background-repeat:repeat-x;background-size:800px 100%;bottom:var(--trackH);top:auto;height:12vh}
.far{width:400%;bottom:var(--trackH);top:auto;height:28vh;background-repeat:repeat-x;background-position:bottom;background-size:1200px 100%}
.mid{width:400%;bottom:var(--trackH);top:auto;height:8vh;background-repeat:repeat-x;background-position:bottom;background-size:560px 100%}
.track{position:absolute;left:0;right:0;bottom:0;height:var(--trackH);background:linear-gradient(180deg,var(--grass) 0 10%,var(--grass2) 10% 13%,var(--road) 13% 78%,var(--grass) 78% 86%,var(--grass2) 86% 88%,var(--dirt) 88% 100%)}
.track .kerb{position:absolute;left:0;right:0;top:11%;height:6px;background:repeating-linear-gradient(90deg,var(--red) 0 20px,#fff 20px 40px);background-size:40px 6px}
.track .dash{position:absolute;left:0;right:0;top:45%;height:4px;background:repeating-linear-gradient(90deg,var(--yellow) 0 36px,transparent 36px 72px);background-size:72px 4px}
.track .edge{position:absolute;left:0;right:0;top:76%;height:4px;background:repeating-linear-gradient(90deg,#fff 0 20px,transparent 20px 40px);background-size:40px 4px}
.track .grit{position:absolute;left:0;right:0;top:13%;height:65%;background-image:radial-gradient(3px 3px at 30px 20px,#46464F 100%,transparent 0),radial-gradient(3px 3px at 110px 60px,#46464F 100%,transparent 0),radial-gradient(3px 3px at 200px 35px,#33333B 100%,transparent 0);background-size:240px 90px}
.track .blur{position:absolute;left:0;right:0;top:13%;height:65%;background:repeating-linear-gradient(90deg,transparent 0 120px,rgba(255,255,255,.1) 120px 200px);opacity:0;background-size:200px 100%}
.track.fast .blur{opacity:1}
.track .dirtpx{position:absolute;left:0;right:0;bottom:0;height:12%;background-image:radial-gradient(4px 4px at 20px 10px,var(--dirt2) 100%,transparent 0),radial-gradient(4px 4px at 70px 30px,var(--dirt2) 100%,transparent 0),radial-gradient(4px 4px at 120px 18px,var(--dirt2) 100%,transparent 0);background-size:160px 50px}
.world{position:absolute;left:0;top:0;height:100%;display:flex;will-change:transform}
.sector{position:relative;flex:0 0 100vw;width:100vw;height:100%;padding:84px 0 calc(var(--trackH) + 96px);display:flex;align-items:center;justify-content:center}
.sector .in{width:min(92vw,980px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.box{background:var(--box);border:4px solid var(--frame);box-shadow:0 0 0 3px #1E1E24,6px 6px 0 3px rgba(0,0,0,.25);padding:22px 24px;position:relative;color:#fff}
.box::before{content:"";position:absolute;inset:4px;border:2px solid rgba(255,255,255,.12);pointer-events:none}
.sector h1{font-size:clamp(52px,7vw,96px);line-height:1}
.sector h2{font-size:clamp(32px,4vw,52px)}
.sector .lead{color:#fff;font-size:clamp(20px,2vw,26px);max-width:58ch;margin-top:12px}
.sector .lead.m{color:var(--on-mute)}
.sector .px{color:var(--yellow)}
#s-start .in>div:first-child{color:#fff;text-shadow:2px 2px 0 #1E3A5F;background:rgba(20,30,60,.55);border:4px solid #1E1E24;box-shadow:6px 6px 0 rgba(0,0,0,.25);padding:20px 22px}
#s-start .px{color:#fff}
.signpost{position:absolute;left:50%;bottom:calc(var(--trackH) - 4px);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
.signpost .board{background:#fff;color:#1E1E24;font-family:var(--vt);font-size:16px;letter-spacing:.06em;padding:8px 12px;border:3px solid #1E1E24;box-shadow:4px 4px 0 rgba(0,0,0,.25);white-space:nowrap}
.signpost .pole{width:4px;height:30px;background:#8A8A94;border-left:2px solid #fff}
/* start: garage */
#s-start .in{width:min(94vw,1200px);display:grid;grid-template-columns:1.2fr .8fr;gap:24px;align-items:end}
.garage{position:relative;height:min(38vh,300px);align-self:end;justify-self:end;width:min(42vw,460px);background:#D9D4C7;border:4px solid #1E1E24;border-bottom:0}
.garage .roof{position:absolute;left:-10px;right:-10px;top:-16px;height:12px;background:repeating-linear-gradient(90deg,var(--red) 0 14px,#fff 14px 28px);border:3px solid #1E1E24}
.garage .door{position:absolute;left:0;right:0;top:0;height:24%;background:repeating-linear-gradient(180deg,#8E8E98 0 8px,#6F6F7A 8px 14px);border-bottom:6px solid var(--yellow)}
.garage .sign{position:absolute;left:50%;top:32%;transform:translateX(-50%);font-family:var(--vt);font-size:18px;letter-spacing:.06em;color:var(--yellow);background:#1E1E24;padding:8px 12px;border:3px solid var(--yellow);white-space:nowrap;animation:blink 1.2s steps(1) infinite}
@keyframes blink{50%{color:#1E1E24;background:var(--yellow)}}
.garage .crew{position:absolute;left:12%;bottom:4px;display:flex;gap:12px}
.garage .crew i{width:24px;height:44px;background:var(--red);display:block;position:relative}
.garage .crew i::before{content:"";position:absolute;left:4px;top:-18px;width:16px;height:16px;background:#F3C9A5}
.garage .crew i::after{content:"";position:absolute;left:0;bottom:0;width:8px;height:14px;background:#1E1E24;box-shadow:16px 0 0 #1E1E24}
.garage .tyres{position:absolute;right:8%;bottom:4px;display:flex;gap:4px}
.garage .tyres i{width:28px;height:28px;background:#111;border:6px solid #3A3A3A;box-sizing:border-box}
.garage .floor{position:absolute;left:-10px;right:-10px;bottom:-12px;height:12px;background:repeating-linear-gradient(90deg,#fff 0 10px,#1E1E24 10px 20px)}
/* lap card */
.lapcard{display:grid;grid-template-columns:auto 1fr;gap:0;padding:0;background:var(--box);border:4px solid var(--c);box-shadow:0 0 0 3px #1E1E24,6px 6px 0 3px rgba(0,0,0,.25);position:relative}
.lapcard .poster{position:relative;background:#F4F1EA;border-right:4px solid var(--c);--ph:min(46vh,440px,calc(100vh - var(--trackH) - 300px));height:var(--ph);width:calc(var(--ph) * 1.75);max-width:58vw;overflow:hidden;image-rendering:auto;-webkit-font-smoothing:antialiased}
.lapcard .poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;display:block;background:#F4F1EA}
.lapcard .poster .tag{position:absolute;left:-6px;top:-6px;background:var(--c);color:#1E1E24;font-family:var(--px);font-size:10px;padding:8px 10px;border:4px solid #1E1E24}
.lapcard .board{padding:22px 20px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.lapcard .n{display:flex;align-items:center;gap:14px;border-bottom:4px dotted var(--c);padding-bottom:8px}
.lapcard .n .big{font-family:var(--ps);font-size:30px;color:var(--c);text-shadow:3px 3px 0 #000}
.lapcard .n .pos{display:flex;flex-direction:column;gap:4px}
.lapcard .n .pos .px{color:var(--c)}
.lapcard .n .pos small{font-family:var(--vt);font-size:18px;color:var(--on-mute)}
.lapcard h2{margin-top:6px;font-size:clamp(28px,3.2vw,42px);text-shadow:3px 3px 0 #000}
.lapcard .kick{color:var(--on-mute);font-size:20px;margin-top:2px}
.tele{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:8px}
.tele div{border:2px solid rgba(255,255,255,.25);padding:6px 10px;min-width:0}
.tele .k{font-family:var(--vt);font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--c)}
.tele .v{font-size:18px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-block;margin-top:12px;font-family:var(--vt);font-size:20px;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;padding:14px 18px;background:var(--c,var(--yellow));color:#1E1E24;border:4px solid #1E1E24;box-shadow:4px 4px 0 rgba(0,0,0,.35);align-self:flex-start;border-radius:0;cursor:pointer}
.btn::before{content:"▶ ";animation:blink2 .8s steps(1) infinite}
@keyframes blink2{50%{opacity:0}}
.btn:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(0,0,0,.35)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chips span{font-size:19px;padding:4px 10px;border:2px solid #fff;background:#1E1E24;border-radius:0;letter-spacing:0}
.driver{display:grid;grid-template-columns:1.3fr 1fr;gap:20px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;align-content:start}
.stats div{padding:10px 12px;border:2px solid #fff}
.stats .k{color:var(--yellow);font-family:var(--vt);font-size:15px;text-transform:uppercase;letter-spacing:.06em}
.stats .v{font-size:22px;margin-top:4px}
.hp{display:flex;gap:4px;margin-top:10px}.hp i{width:18px;height:18px;background:var(--green);border:2px solid #000}
.stops{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stop{padding:12px 14px;border:3px solid #fff;min-width:0;background:#1E1E24}
.stop .when{font-family:var(--vt);font-size:15px;letter-spacing:.06em;color:var(--yellow)}
.stop b{display:block;margin-top:8px;font-weight:400;font-size:24px;line-height:1.1}
.stop span{display:block;color:var(--on-mute);font-size:19px;margin-top:2px}
.stop p{color:var(--on-mute);font-size:18px;margin-top:8px;line-height:1.2}
.parts{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.cgrid{margin-top:16px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
/* HUD like a game status bar */
.hud{position:absolute;left:0;right:0;top:0;z-index:8;padding:14px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--ps);font-size:9px}
.hud .brand{text-decoration:none;color:#fff;text-shadow:2px 2px 0 #1E3A5F}
.hud .brand b{color:var(--yellow);font-weight:400}
.hud .right{display:flex;gap:8px;align-items:center}
.hud .lang{display:flex;border:3px solid #1E1E24;background:#fff;border-radius:0}
.hud .lang button{background:none;border:0;color:#6B6B76;font-family:var(--ps);font-size:10px;padding:6px 10px;cursor:pointer;border-radius:0}
.hud .lang button[aria-pressed="true"]{background:var(--yellow);color:#1E1E24}
.hud .lapno{color:#1E1E24;background:#fff;border:3px solid #1E1E24;padding:4px 10px;border-radius:0;font-family:var(--vt);font-size:16px;letter-spacing:.06em}
.hud a.alt{color:#fff;text-decoration:none;text-shadow:2px 2px 0 #1E3A5F;font-family:var(--vt);font-size:17px;letter-spacing:.06em}
.bars{position:absolute;left:50%;top:14px;transform:translateX(-50%);display:flex;gap:22px;z-index:8;image-rendering:pixelated}
.bar{display:flex;align-items:center;gap:0;filter:drop-shadow(2px 2px 0 rgba(0,0,0,.35))}
.bar svg{width:28px;height:28px;display:block;shape-rendering:crispEdges;position:relative;z-index:1}
.bar b{width:78px;height:16px;background:#1E1E24;border:3px solid #1E1E24;display:block;position:relative;margin-left:-4px;box-sizing:content-box}
.bar b::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 12px,#1E1E24 12px 14px);z-index:1}
.bar b::after{content:"";position:absolute;left:0;top:0;bottom:0;width:var(--w,70%);background:linear-gradient(180deg,#FFE24A 0 50%,#F5C400 50%)}
.bar small{position:absolute;left:0;right:0;top:30px;font-family:var(--ps);font-size:7px;color:#fff;text-align:center;text-shadow:1px 1px 0 #1E3A5F;letter-spacing:0}
.bar{position:relative}
.prog{position:absolute;left:0;right:0;top:0;height:6px;background:#1E1E24;z-index:8}
.prog i{display:block;height:100%;width:0;background:var(--yellow)}
.marks{position:absolute;left:0;right:0;top:0;height:6px;z-index:9;pointer-events:none}
.marks i{position:absolute;top:0;width:4px;height:6px;background:var(--red)}
.hint{position:absolute;left:50%;bottom:calc(var(--trackH) * .62);transform:translateX(-50%);font-family:var(--vt);font-size:18px;letter-spacing:.06em;color:#1E1E24;background:#fff;padding:8px 12px;border:3px solid #1E1E24;transition:opacity .4s;z-index:4;white-space:nowrap;animation:blink3 1s steps(1) infinite}
@keyframes blink3{50%{opacity:.4}}
.hint.hide{opacity:0;animation:none}
/* car */
.car{position:absolute;left:14vw;bottom:calc(var(--trackH) * .22);width:220px;height:80px;z-index:4;transform-origin:50% 100%;will-change:left,transform,bottom;image-rendering:pixelated;transition:bottom .55s cubic-bezier(.4,0,.2,1),scale .55s cubic-bezier(.4,0,.2,1);cursor:pointer}
.car.lane2{bottom:calc(var(--trackH) * .55);scale:.9}
.car svg{width:100%;height:100%;overflow:visible;display:block;shape-rendering:crispEdges}
.car .wheel{transform-box:fill-box;transform-origin:center}
.car.moving .wheel{animation:spin .28s steps(4) infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.car .flame{opacity:0}
.car.moving .flame{opacity:1;animation:flick .14s steps(2) infinite}
@keyframes flick{to{transform:translateX(-6px) scaleY(.6)}}
.car .speedl{opacity:0}
.car.moving .speedl{opacity:1;animation:flick .2s steps(2) infinite}
.car .chassis{transform-box:fill-box;transform-origin:center}
.car.moving .chassis{animation:bounce .3s steps(2) infinite}
@keyframes bounce{50%{transform:translateY(-2px)}}
.car .dir{transform-box:fill-box;transform-origin:center;transition:transform .5s cubic-bezier(.45,0,.2,1)}
.car.reverse .dir{transform:scaleX(-1)}
.car.turning .dir{animation:turn .5s cubic-bezier(.45,0,.2,1)}
.car.turning .speedl,.car.turning .flame,.car.turning .beam{opacity:0!important;animation:none!important}
.car.turning .wheel{animation:none}
@keyframes turn{0%{transform:scaleX(1) rotate(0)}45%{transform:scaleX(.08) scaleY(1.08) rotate(-6deg)}100%{transform:scaleX(-1) rotate(0)}}
.car.turning.fwd .dir{animation-name:turnb}
@keyframes turnb{0%{transform:scaleX(-1) rotate(0)}45%{transform:scaleX(-.08) scaleY(1.08) rotate(6deg)}100%{transform:scaleX(1) rotate(0)}}
.dust{position:absolute;width:8px;height:8px;background:#6E6E78;z-index:3;pointer-events:none;animation:dust .6s ease-out forwards}
@keyframes dust{to{transform:translate(var(--dx),-40px) scale(2.2);opacity:0}}
.car .beam{opacity:0}
.car.honk .beam{animation:beam .5s steps(3)}
@keyframes beam{0%{opacity:1}100%{opacity:0}}
.carpx .horn,.carpx .beam{display:none}
.car .horn{opacity:0;font-family:var(--px);font-size:7px;fill:#1E1E24}
.car.honk .horn{animation:hornpop .6s steps(4)}
@keyframes hornpop{0%{transform:translateY(0);opacity:1}80%{opacity:1}100%{transform:translateY(-8px);opacity:0}}
.skid{position:absolute;bottom:calc(var(--trackH) * .22 - 6px);height:8px;width:120px;background:repeating-linear-gradient(90deg,#1E1E24 0 10px,transparent 10px 14px);opacity:0;z-index:3}
.skid.show{opacity:.7;transition:opacity .2s}
/* scene transition into a project */
.wipe{position:fixed;inset:0;z-index:50;pointer-events:none;background-color:#1E1E24;background-image:linear-gradient(45deg,#fff 25%,transparent 25%,transparent 75%,#fff 75%),linear-gradient(45deg,#fff 25%,transparent 25%,transparent 75%,#fff 75%);background-size:28px 28px;background-position:0 0,14px 14px;clip-path:inset(0 100% 0 0)}
.wipe.go{animation:wipe .7s steps(14) forwards}
@keyframes wipe{to{clip-path:inset(0 0 0 0)}}
.wipe .t{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--vt);font-size:26px;letter-spacing:.06em;color:var(--yellow);background:#1E1E24;padding:16px 22px;border:4px solid var(--yellow);opacity:0;white-space:nowrap}
.wipe.go .t{animation:tpop .3s steps(2) .45s forwards}
@keyframes tpop{to{opacity:1}}
.car.zoom{transition:left .7s cubic-bezier(.6,0,1,1)!important}
@media (max-height:1100px){.tele{grid-template-columns:repeat(4,1fr);gap:4px}.tele div{padding:4px 6px}.tele .v{font-size:15px}.lapcard .kick{font-size:17px}.lapcard .board{padding:14px 16px 12px;gap:4px}.btn{margin-top:8px;padding:8px 14px;font-size:18px}.lapcard .n .big{font-size:24px}.lapcard h2{font-size:clamp(22px,2.4vw,32px)}}
@media (max-height:1100px){.tele{display:none}}
@media (max-width:760px){
  body{font-size:19px}
  .sector{padding-top:70px}
  #s-start .in{grid-template-columns:1fr;gap:12px}
  .garage,.bars,.hud .alt{display:none}
  .lapcard{grid-template-columns:1fr}
  .lapcard .poster{border-right:0;border-bottom:6px solid var(--c);max-height:30vh}
  .lapcard .board{padding:14px}
  .lapcard .n .big{font-size:22px}
  .tele{display:none}
  .driver,.parts{grid-template-columns:1fr}
  .stops{grid-template-columns:1fr;gap:8px}
  .stop p{display:none}
  .box{padding:14px}
  .car{width:176px;height:64px;left:8vw}
  .signpost .board{font-size:8px}
  :root{--trackH:26vh}
}
@media (prefers-reduced-motion:reduce){.car *,.hint,.garage .sign,.btn::before{animation:none!important}.stage{position:static;height:auto}.world{position:static;flex-direction:column;transform:none!important}.sector{flex:none;height:auto;min-height:70vh}.spacer{display:none}.layer,.track,.car,.hint,.signpost,.skid,.bars{display:none}}

/* title screen */
.title{position:fixed;inset:0;z-index:60;background:linear-gradient(180deg,#4FB8EE 0%,#9FDCF7 70%,#5FC640 70%,#5FC640 78%,#3B3B45 78%);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;text-align:center;padding:24px 24px 18vh;transition:opacity .5s steps(5),transform .5s steps(5)}
.title.out{opacity:0;transform:scale(1.08);pointer-events:none}
.title::before{content:"";position:absolute;left:0;right:0;top:78%;height:10px;background:repeating-linear-gradient(90deg,var(--red) 0 20px,#fff 20px 40px)}
.title .cl{position:absolute;left:0;top:0;width:200%;height:60%;background-repeat:repeat-x;background-size:640px 100%;animation:drift 50s linear infinite;opacity:.9}

  sec.push(`<section class="sector" id="s-finish"><div class="in box"><p class="px">${r.flag}</p><h2 style="margin-top:8px">${esc(r.thanks)}</h2><p class="lead m">${esc(t['fin.lead'])}</p><div class="cgrid"><div class="stop"><span class="when">EMAIL</span><b>ngohieu612003@gmail.com</b></div><div class="stop"><span class="when">BEHANCE</span><b><a href="https://www.behance.net/hiungminh1" target="_blank" rel="noopener" style="text-decoration:none">behance.net/hiungminh1</a></b></div><div class="stop"><span class="when">${t['fin.k3']}</span><b>0922 526 686</b></div><div class="stop"><span class="when">${t['fin.k4']}</span><b>2024 — 2026</b></div></div><p class="px" style="margin-top:16px">★ ${r.gameover} ★</p></div>${sign(r.finishT.toUpperCase())}</section>`);
  world.innerHTML=sec.join('');

  hint.textContent=(innerWidth<760?r.hintM:r.hint).toUpperCase();

}
let W=0,vw=0,max=0,names=[],garageX=0,homeX=0;
function layout(){vw=innerWidth;const secs=[...world.children];secs.forEach(s=>s.style.width=vw+'px');W=secs.length*vw;max=W-vw;spacer.style.height=max+'px';
  names=secs.map(s=>s.id.replace('s-',''));marks.innerHTML=secs.map((s,i)=>`<i style="left:${(i/(secs.length-1))*100}%"></i>`).join('');
  const g=document.getElementById('garage');homeX=vw<760?vw*.08:vw*.14;
  if(g&&getComputedStyle(g).display!=='none'){const gr=g.getBoundingClientRect();garageX=gr.left+(gr.width-car.offsetWidth)/2+scrollY;}else garageX=homeX;
  update(true);}
let lastX=0,lastT=0,stillTimer=null,dir=1,turnTimer=null;
function update(force){const y=Math.max(0,Math.min(max,scrollY));world.style.transform=`translate3d(${-y}px,0,0)`;far.style.transform=`translate3d(${-Math.round(y*.18)}px,0,0)`;mid.style.transform=`translate3d(${-Math.round(y*.55)}px,0,0)`;stars.style.transform=`translate3d(${-Math.round(y*.06)}px,0,0)`;kerb.style.backgroundPosition=`${-y}px 0`;dash.style.backgroundPosition=`${-y}px 0`;edge.style.backgroundPosition=`${-Math.round(y*1.2)}px 0`;
  const gx=garageX-y;const cx=Math.max(homeX,gx);car.style.left=cx+'px';
  prog.style.width=(max?y/max*100:0)+'%';const idx=Math.min(names.length-1,Math.round(y/vw));const n=names[idx];const pi=P.findIndex(p=>p.id===n);lapno.textContent=pi>=0?UI[lang].lap.toUpperCase()+' '+pad(pi+1)+' / '+NP():(n==='start'?(y<40?'PIT BOX':'START'):n==='finish'?'FINISH':n.toUpperCase());
  const now=performance.now();const dx=y-lastX;const dt=Math.max(16,now-lastT);const v=dx/dt;targetV=Math.abs(dx)>1?v:0;engineTick();
  if(Math.abs(dx)>1){const nd=dx<0?-1:1;
    if(nd!==dir){dir=nd;car.classList.add('turning');car.classList.toggle('lane2',nd===-1);puff(cx);car.classList.toggle('fwd',nd===1);car.classList.toggle('reverse',nd===-1);skid.style.left=(cx+(nd===-1?car.offsetWidth-120:0))+'px';skid.classList.add('show');clearTimeout(turnTimer);turnTimer=setTimeout(()=>{car.classList.remove('turning');skid.classList.remove('show');},460);}
    car.classList.add('moving');car.style.transform=`rotate(${Math.max(-3,Math.min(3,-v*2.5))}deg)`;track.classList.toggle('fast',Math.abs(v)>1.2);hint.classList.add('hide');clearTimeout(stillTimer);stillTimer=setTimeout(()=>{car.classList.remove('moving');track.classList.remove('fast');car.style.transform='';targetV=0;engineTick();},160);}
  lastX=y;lastT=now;}
addEventListener('scroll',()=>update(),{passive:true});addEventListener('resize',layout);
addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowDown'){scrollBy({top:vw*.5,behavior:'smooth'});e.preventDefault();}if(e.key==='ArrowLeft'||e.key==='ArrowUp'){scrollBy({top:-vw*.5,behavior:'smooth'});e.preventDefault();}});
addEventListener('wheel',e=>{if(Math.abs(e.deltaX)>Math.abs(e.deltaY)){scrollBy({top:e.deltaX});e.preventDefault();}},{passive:false});
/* ---- audio: engine + chiptune background music (original loop) ---- */
let eng=null,muted=false,targetV=0,music=null;try{muted=localStorage.getItem('muted')==='1';}catch(e){}
function engineStart(){if(eng||muted)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
  const o1=ac.createOscillator();o1.type='triangle';const o2=ac.createOscillator();o2.type='square';const sub=ac.createOscillator();sub.type='sine';
  const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=420;f.Q.value=.7;const g=ac.createGain();g.gain.value=0;const g2=ac.createGain();g2.gain.value=.25;const gs=ac.createGain();gs.gain.value=.5;
  const nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const n=ac.createBufferSource();n.buffer=nb;n.loop=true;const nf=ac.createBiquadFilter();nf.type='bandpass';nf.frequency.value=160;nf.Q.value=1.2;const ng=ac.createGain();ng.gain.value=.35;
  o1.frequency.value=58;o2.frequency.value=116;sub.frequency.value=29;o1.connect(f);o2.connect(g2).connect(f);sub.connect(gs).connect(f);n.connect(nf).connect(ng).connect(f);f.connect(g).connect(ac.destination);o1.start();o2.start();sub.start();n.start();
  eng={o1,o2,sub,f,g,nf};}catch(e){}}
function engineTick(){if(!eng||!ac)return;const t=ac.currentTime;const sp=Math.min(1,Math.abs(targetV)/2.2);const base=58+sp*110;eng.o1.frequency.setTargetAtTime(base,t,.15);eng.o2.frequency.setTargetAtTime(base*2,t,.15);eng.sub.frequency.setTargetAtTime(base/2,t,.15);eng.f.frequency.setTargetAtTime(380+sp*900,t,.15);eng.nf.frequency.setTargetAtTime(140+sp*260,t,.15);eng.g.gain.setTargetAtTime(muted?0:(sp>0.02?.06+sp*.10:0),t,.18);}
/* chiptune: 16-step sequencer, square lead + triangle bass + noise hats, 92 BPM, original 8-bar loop */
const N={C4:261.6,D4:293.7,E4:329.6,F4:349.2,G4:392,A4:440,B4:493.9,C5:523.3,D5:587.3,E5:659.3,G5:784,A5:880,C3:130.8,G3:196,A3:220,F3:174.6,E3:164.8,D3:146.8};
const LEAD=['E5','E5',0,'E5',0,'C5','E5',0,'G5',0,0,0,'G4',0,0,0,'C5',0,0,'G4',0,0,'E4',0,0,'A4',0,'B4',0,'A4','A4',0,'G4','E5','G5','A5',0,'F4','G4',0,'E5',0,'C5','D5','B4',0,0,0,'C5',0,0,'G4',0,0,'E4',0,0,'A4',0,'B4',0,'A4','A4',0];
const BASS=['C3',0,'C3',0,'G3',0,'G3',0,'A3',0,'A3',0,'F3',0,'G3',0,'C3',0,'C3',0,'G3',0,'G3',0,'A3',0,'E3',0,'F3',0,'G3',0,'C3',0,'C3',0,'G3',0,'G3',0,'A3',0,'A3',0,'F3',0,'G3',0,'C3',0,'E3',0,'F3',0,'D3',0,'G3',0,'G3',0,'C3',0,'C3',0];
function musicStart(song){song=song||{L:LEAD,B:BASS,bpm:92,hat:true,vol:.11};if(music||muted)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const master=ac.createGain();master.gain.value=song.vol;master.connect(ac.destination);const nb=ac.createBuffer(1,ac.sampleRate*.1,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);
  const step=60/song.bpm/4;let i=0,next=ac.currentTime+.05;const SL=song.L,SB=song.B,SN=SL.length;
  function note(f,t,dur,type,vol){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(master);o.start(t);o.stop(t+dur+.02);}
  function tick(){while(next<ac.currentTime+.25){const k=i%SN;if(SL[k])note(N[SL[k]],next,step*1.1,'square',.45);if(SB[k])note(N[SB[k]],next,step*1.8,'triangle',.9);if(song.hat&&k%2===0){const s=ac.createBufferSource();s.buffer=nb;const g=ac.createGain();g.gain.value=k%4===0?.35:.18;s.connect(g).connect(master);s.start(next);}next+=step;i++;}music.timer=setTimeout(tick,100);}
  music={master,timer:null};tick();}catch(e){}}
function musicStop(){if(!music)return;clearTimeout(music.timer);music.master.gain.setTargetAtTime(0,ac.currentTime,.05);const m=music;music=null;setTimeout(()=>m.master.disconnect(),400);}
['wheel','keydown','touchstart','pointerdown'].forEach(ev=>addEventListener(ev,()=>{if(document.getElementById('title').classList.contains('out')){engineStart();musicStart();}},{passive:true}));
const mute=document.getElementById('mute');mute.textContent=muted?'🔇 SOUND OFF':'🔊 SOUND ON';mute.addEventListener('click',()=>{muted=!muted;try{localStorage.setItem('muted',muted?'1':'0')}catch(e){}mute.textContent=muted?'🔇 SOUND OFF':'🔊 SOUND ON';if(muted){musicStop();engineTick();}else if(!title.classList.contains('out')){titleSnd=false;titleSound();}else{engineStart();musicStart();}});
function puff(x){for(let i=0;i<6;i++){const d=document.createElement('div');d.className='dust';d.style.left=(x+Math.random()*120)+'px';d.style.bottom=car.style.bottom||getComputedStyle(car).bottom;d.style.setProperty('--dx',(Math.random()*60-30)+'px');stage.appendChild(d);setTimeout(()=>d.remove(),650);}}
/* horn + headlights on click */
let ac=null;function honk(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime;[[392,0],[523,.12]].forEach(([f,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(.18,t+d+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d+.22);o.connect(g).connect(ac.destination);o.start(t+d);o.stop(t+d+.24);});}catch(e){}
  car.classList.remove('honk');void car.offsetWidth;car.classList.add('honk');clearTimeout(honk.t);honk.t=setTimeout(()=>car.classList.remove('honk'),650);}

const title=document.getElementById('title');document.getElementById('titlecl').style.backgroundImage=stars.style.backgroundImage;document.getElementById('tcar').innerHTML=document.getElementById('pix').innerHTML;

const TLEAD=['E4',0,'G4',0,'B4',0,'E5',0,'D5',0,'B4',0,'G4',0,'B4',0,'C4',0,'E4',0,'G4',0,'C5',0,'B4',0,'G4',0,'E4',0,'D4',0,'A3',0,'C4',0,'E4',0,'A4',0,'G4',0,'E4',0,'C4',0,'E4',0,'B3',0,'D4',0,'G4',0,'B4',0,'A4',0,'G4',0,'D4',0,'B3',0];

function uiBlip(){if(muted)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const t=ac.currentTime;[[660,0,.05],[990,.05,.08]].forEach(([f,d,l])=>{const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.08,t+d);g.gain.exponentialRampToValueAtTime(.0001,t+d+l);o.connect(g).connect(ac.destination);o.start(t+d);o.stop(t+d+l+.02);});}catch(e){}}

function beep(f,d,t0){try{const t=(t0??ac.currentTime);const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.02);}catch(e){}}
